version: 2

models:
  - name: dim_date
    description: "Date dimension covering 2022-2026 with Nigerian public holidays"
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]
      - name: is_weekend
        tests: [not_null]
      - name: is_public_holiday
        tests: [not_null]

  - name: dim_customer
    description: "SCD2 customer dimension"
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_product
    description: "SCD2 product dimension"
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_store
    description: "Store dimension"
    columns:
      - name: store_key
        tests: [not_null, unique]
      - name: store_id
        tests: [not_null, unique]

  - name: dim_employee
    description: "Employee dimension"
    columns:
      - name: employee_key
        tests: [not_null, unique]
      - name: employee_id
        tests: [not_null]

  - name: dim_payment_method
    description: "Payment method dimension"
    columns:
      - name: payment_method_key
        tests: [not_null, unique]
      - name: payment_method_id
        tests: [not_null, unique]

  - name: fct_sales
    description: "Transactional fact — one row per order line item"
    columns:
      - name: sales_key
        tests: [not_null, unique]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: line_total
        tests: [not_null]

  - name: fct_payments
    description: "Transactional fact — one row per payment event"
    columns:
      - name: payment_key
        tests: [not_null, unique]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: payment_method_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment_method')
              field: payment_method_key
      - name: amount_paid
        tests: [not_null]

  - name: fct_inventory_daily
    description: "Periodic snapshot — one row per product x store x day"
    columns:
      - name: inventory_key
        tests: [not_null, unique]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key

  - name: fct_order_lifecycle
    description: "Accumulating snapshot — one row per order with status timestamps"
    columns:
      - name: order_key
        tests: [not_null, unique]
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'paid', 'shipped', 'delivered', 'cancelled']

  - name: flagged_payments
    description: "Data quality — anomalous payments isolated here"
    columns:
      - name: flag_key
        tests: [not_null, unique]
      - name: payment_id
        tests: [not_null, unique]
      - name: flag_reason
        tests: [not_null]